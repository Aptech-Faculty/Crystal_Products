<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amethyst Crystals - Crystal Gems World</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@400;700&display=swap"
    rel="stylesheet">
  <link rel="icon" type="image/png" href="crystal-new-logo.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="index.css">
  <link rel="stylesheet" href="amthyst-style.css">
</head>

<body>
  <section class="banner">
    <div class="banner-content text-center">
      <h1 class="display-3 mb-3">Mystic Amethyst</h1>
      <p class="lead mb-4">Healing Energy and Spiritual Clarity</p>
      <div class="d-flex justify-content-center gap-3">
        <a href="#shop" class="btn btn-main"
          style="background: var(--amethyst-primary) !important; border-color: var(--amethyst-primary) !important;">Shop
          Purple</a>
        <a href="compare product.html" class="btn btn-outline-light rounded-pill px-4">Compare</a>
      </div>
    </div>
  </section>

  <section id="shop" class="shop-section py-5">
    <div class="container py-5">
      <div class="section-title text-center mb-5">
        <span class="text-uppercase fw-bold" style="letter-spacing: 5px; color: var(--amethyst-primary);">Spiritual
          Healing</span>
        <h2 class="display-5 fw-bold mt-2">Amethyst Collection</h2>
        <div class="mx-auto mt-3" style="width: 80px; height: 3px; background: var(--amethyst-primary);"></div>
      </div>

      <div class="row g-4">
        <!-- Card 1 -->
        <div class="col-xl-3 col-lg-4 col-md-6">
          <div class="product-card">
            <div class="img-container">
              <img src="amthyst/earings.webp" alt="Amethyst Stud Earrings">
            </div>
            <div class="product-info">
              <h5 class="product-title">Amethyst Cluster Studs</h5>
              <p class="product-price">₹999</p>
              <button class="btn add-cart-btn" style="background: var(--amethyst-primary) !important;">Add to
                Cart</button>
            </div>
          </div>
        </div>

        <!-- Card 2 -->
        <div class="col-xl-3 col-lg-4 col-md-6">
          <div class="product-card">
            <div class="img-container">
              <img src="amthyst/rings.jpg" alt="Amethyst Rings">
            </div>
            <div class="product-info">
              <h5 class="product-title">Celestial Amethyst Ring</h5>
              <p class="product-price">₹799</p>
              <button class="btn add-cart-btn" style="background: var(--amethyst-primary) !important;">Add to
                Cart</button>
            </div>
          </div>
        </div>

        <!-- Card 3 -->
        <div class="col-xl-3 col-lg-4 col-md-6">
          <div class="product-card">
            <div class="img-container">
              <img src="amthyst/nscklace.jpg" alt="Amethyst Necklace">
            </div>
            <div class="product-info">
              <h5 class="product-title">Spiritual Amethyst Necklace</h5>
              <p class="product-price">₹1,199</p>
              <button class="btn add-cart-btn" style="background: var(--amethyst-primary) !important;">Add to
                Cart</button>
            </div>
          </div>
        </div>

        <div class="col-xl-3 col-lg-4 col-md-6">
          <div class="product-card">
            <div class="img-container">
              <img src="amthyst/f0d3aa0bc18c108984bb7c2ba51fbddc.jpg" alt="Amethyst Beads Bracelet">
            </div>
            <div class="product-info">
              <h5 class="product-title">Handmade Amethyst Beads</h5>
              <p class="product-price">₹1,199</p>
              <button class="btn add-cart-btn" style="background: var(--amethyst-primary) !important;">Add to
                Cart</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="components.js"></script>

</html>
