<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compare Crystals | Crystal Gems World</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <link rel="icon" type="image/png" href="crystal-new-logo.png">
    <link rel="stylesheet" href="compare-style.css">
    <link rel="stylesheet" href="index.css">
</head>

<body class="oppo-brand">
    <section class="compare-hero py-5">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-lg-12 text-center">
                    <h1 class="display-4 fw-bold">Crystals Comparison</h1>
                    <p class="lead">Nature’s beauty, charged with energy.</p>
                </div>
            </div>
        </div>
    </section>


    <section class="comparison-tool py-5 bg-light">
        <div class="container">
            <div class="row">
                <div class="col-12">
                    <div class="comparison-table-responsive">
                        <table class="comparison-table">
                            <thead>
                                <tr>
                                    <th>Features</th>
                                    <th>
                                        <select class="form-select" id="select1">
                                            <option selected disabled>Select Crystal</option>
                                        </select>
                                    </th>
                                    <th>
                                        <select class="form-select" id="select2">
                                            <option selected disabled>Select Crystal</option>
                                        </select>
                                    </th>
                                    <th>
                                        <select class="form-select" id="select3">
                                            <option selected disabled>Select Crystal</option>
                                        </select>
                                    </th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr data-feature="image">
                                    <td>Image</td>
                                    <td id="img1"></td>
                                    <td id="img2"></td>
                                    <td id="img3"></td>
                                </tr>
                                <tr data-feature="price">
                                    <td>Price</td>
                                    <td id="price1">-</td>
                                    <td id="price2">-</td>
                                    <td id="price3">-</td>
                                </tr>
                                <tr data-feature="type">
                                    <td>Type</td>
                                    <td id="type1">-</td>
                                    <td id="type2">-</td>
                                    <td id="type3">-</td>
                                </tr>
                                <tr data-feature="color">
                                    <td>Color</td>
                                    <td id="color1">-</td>
                                    <td id="color2">-</td>
                                    <td id="color3">-</td>
                                </tr>
                                <tr data-feature="chakra">
                                    <td>Chakra</td>
                                    <td id="chakra1">-</td>
                                    <td id="chakra2">-</td>
                                    <td id="chakra3">-</td>
                                </tr>
                                <tr data-feature="healing">
                                    <td>Healing Properties</td>
                                    <td id="healing1">-</td>
                                    <td id="healing2">-</td>
                                    <td id="healing3">-</td>
                                </tr>
                                <tr data-feature="origin">
                                    <td>Origin</td>
                                    <td id="origin1">-</td>
                                    <td id="origin2">-</td>
                                    <td id="origin3">-</td>
                                </tr>
                                <tr data-feature="hardness">
                                    <td>Hardness (Mohs)</td>
                                    <td id="hardness1">-</td>
                                    <td id="hardness2">-</td>
                                    <td id="hardness3">-</td>
                                </tr>
                                <tr data-feature="meaning">
                                    <td>Spiritual Meaning</td>
                                    <td id="meaning1">-</td>
                                    <td id="meaning2">-</td>
                                    <td id="meaning3">-</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <div class="text-center mt-4">
                        <button class="btn btn-outline-primary btn-lg" id="resetBtn">Reset Comparison</button>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="components.js"></script>
    <script src="compare.js"></script>
</body>

</html>
