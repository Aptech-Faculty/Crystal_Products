<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us Crystals- Crystal Gems World</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Playfair+Display:wght@400;700&display=swap"
    rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="icon" type="image/png" href="crystal-new-logo.png">
  <link rel="stylesheet" href="contact-crystal.css">
  <link rel="stylesheet" href="index.css">
</head>

<body>
  <section class="page-banner d-flex">
    <div class="banner-overlay"></div>

    <div class="banner-text">
      <h1 class="display-4 fw-bold">Contact Us</h1>
      <p class="lead">Reach out to us for any crystal inquiries or support</p>
    </div>
  </section>
  <section class="contact-section py-5">
    <div class="container">
      <div class="row g-4 align-items-start">


        <div class="col-md-6">
          <div class="card shadow crystal-card p-4">
            <h2 class="text-brown fw-bold mb-4 text-center">Send Us a Message</h2>
            <form>
              <div class="mb-3">
                <label for="name" class="form-label fw-semibold">Name</label>
                <input type="text" class="form-control crystal-input" id="name" placeholder="Your Name">
              </div>
              <div class="mb-3">
                <label for="email" class="form-label fw-semibold">Email</label>
                <input type="email" class="form-control crystal-input" id="email" placeholder="Your Email">
              </div>
              <div class="mb-3">
                <label for="phone" class="form-label fw-semibold">Phone (Optional)</label>
                <input type="tel" class="form-control crystal-input" id="phone" placeholder="Your Phone">
              </div>
              <div class="mb-3">
                <label for="message" class="form-label fw-semibold">Message</label>
                <textarea class="form-control crystal-input" id="message" rows="5"
                  placeholder="Write your message..."></textarea>
              </div>
              <button type="submit" class="btn btn-crystal fw-bold w-100">Send Message</button>
            </form>
          </div>
        </div>


        <div class="col-md-6">
          <div class="card shadow crystal-card p-4">
            <h2 class="text-brown fw-bold mb-4 text-center">Contact Information</h2>
            <p><i class="fas fa-map-marker-alt me-2 text-brown"></i> 123 Crystal Street, Your City</p>
            <p><i class="fas fa-phone me-2 text-brown"></i> +1 234 567 890</p>
            <p><i class="fas fa-envelope me-2 text-brown"></i> contact@yourcrystals.com</p>
            <div class="social-icons mt-4 text-center">
              <a href="#" class="me-3 text-brown"><i class="fab fa-facebook fa-lg"></i></a>
              <a href="#" class="me-3 text-brown"><i class="fab fa-twitter fa-lg"></i></a>
              <a href="#" class="me-3 text-brown"><i class="fab fa-instagram fa-lg"></i></a>
              <a href="#" class="text-brown"><i class="fab fa-pinterest fa-lg"></i></a>
            </div>
          </div>
        </div>

      </div>
    </div>
  </section>
  </section>
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="components.js"></script>

</html>
